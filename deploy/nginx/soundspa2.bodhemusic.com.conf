# Install as a separate site. Do not edit the V1 or staging server blocks.
server {
    listen 80;
    listen [::]:80;
    server_name soundspa2.bodhemusic.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Bearer tokens in path URLs must not be retained in access/error logs.
    location ~ "^/register/([A-Za-z0-9_-]{43})/?$" {
        access_log off;
        error_log /dev/null emerg;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 302 "https://$host/register#token=$1";
    }
    location /register/ {
        access_log off;
        error_log /dev/null emerg;
        return 404;
    }
    location ^~ /join/ {
        access_log off;
        error_log /dev/null emerg;
        return 301 https://$host$request_uri;
    }
    location ^~ /activate-device/ {
        access_log off;
        error_log /dev/null emerg;
        return 301 https://$host$request_uri;
    }
    location ^~ /fake-checkout/ {
        access_log off;
        error_log /dev/null emerg;
        return 301 https://$host$request_uri;
    }
    # The shared Next image contains legacy V1 pages/APIs; disable them only on this V2 production host.
    location = /app { return 404; }
    location ^~ /app/ { return 404; }
    location = /ios-player { return 404; }
    location ^~ /ios-player/ { return 404; }
    location = /no-auth { return 404; }
    location ^~ /no-auth/ { return 404; }
    location = /local-preview { return 404; }
    location ^~ /local-preview/ { return 404; }
    location ^~ /api/auth/ { return 404; }
    location = /api/app-data { return 404; }
    location = /api/check-app-access { return 404; }
    location = /api/monitoring/ping { return 404; }
    location = /api/webhooks/prodamus { return 404; }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name soundspa2.bodhemusic.com;

    # Provision these files before enabling this server block.
    ssl_certificate /etc/letsencrypt/live/soundspa2.bodhemusic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soundspa2.bodhemusic.com/privkey.pem;

    location ~ "^/register/([A-Za-z0-9_-]{43})/?$" {
        access_log off;
        error_log /dev/null emerg;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 302 "https://$host/register#token=$1";
    }
    location /register/ {
        access_log off;
        error_log /dev/null emerg;
        return 404;
    }

    # Local artwork is isolated from staging and served from the production media mount.
    location ^~ /artwork/ {
        alias /var/lib/soundspa-v2-production-media/artwork/;
    }

    location = /api/v2/admin/content/upload {
        client_max_body_size 128m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location = /api/v2/admin/content/uploads {
        client_max_body_size 1m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location ^~ /join/ {
        access_log off;
        error_log /dev/null emerg;
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location ^~ /activate-device/ {
        access_log off;
        error_log /dev/null emerg;
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location ^~ /fake-checkout/ {
        access_log off;
        error_log /dev/null emerg;
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    # Keep the legacy V1 surface inaccessible on V2 production without changing staging routing.
    location = /app { return 404; }
    location ^~ /app/ { return 404; }
    location = /ios-player { return 404; }
    location ^~ /ios-player/ { return 404; }
    location = /no-auth { return 404; }
    location ^~ /no-auth/ { return 404; }
    location = /local-preview { return 404; }
    location ^~ /local-preview/ { return 404; }
    location ^~ /api/auth/ { return 404; }
    location = /api/app-data { return 404; }
    location = /api/check-app-access { return 404; }
    location = /api/monitoring/ping { return 404; }
    location = /api/webhooks/prodamus { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
