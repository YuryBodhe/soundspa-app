server {
    listen 80;
    listen [::]:80;

    server_name test.soundspa.bodhemusic.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Checkout capabilities are bearer secrets in the URL; do not log the redirect request.
    location ^~ /fake-checkout/ {
        access_log off;
        error_log /dev/null emerg;
        return 301 https://$host$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name test.soundspa.bodhemusic.com;

    ssl_certificate     /etc/letsencrypt/live/test.soundspa.bodhemusic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.soundspa.bodhemusic.com/privkey.pem;

    location ^~ /music/ {
        alias /var/lib/soundspa-v2-media/music/;
    }

    location ^~ /artwork/ {
        alias /var/lib/soundspa-v2-media/artwork/;
    }

    location = /api/v2/admin/content/upload {
        client_max_body_size 128m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Small bounded chunks; no global request-timeout changes.
    location = /api/v2/admin/content/uploads {
        client_max_body_size 1m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location ^~ /noise/ {
        alias /var/lib/soundspa-v2-media/ambient/;
    }

    # Partner Invite tokens are bearer secrets in the URL path; never log them.
    location ^~ /join/ {
        access_log off;
        proxy_pass http://127.0.0.1:3101;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
    }

    # Device activation tokens are bearer secrets in the URL path; never log them.
    location ^~ /activate-device/ {
        access_log off;
        proxy_pass http://127.0.0.1:3101;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
    }

    # Fake aggregate checkout capability is a bearer secret in the URL path; never log it.
    location ^~ /fake-checkout/ {
        access_log off;
        error_log /dev/null emerg;
        proxy_pass http://127.0.0.1:3101;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
    }
}
