services:
  app:
    build:
      context: .
      args:
        DATABASE_URL: postgresql://dummy:dummy@127.0.0.1:5432/dummy
        NEXT_PUBLIC_V2_MUSIC_DIAGNOSTICS: ${NEXT_PUBLIC_V2_MUSIC_DIAGNOSTICS:-0}
        NEXT_PUBLIC_V2_AMBIENT_OVERLAP: ${NEXT_PUBLIC_V2_AMBIENT_OVERLAP:-0}
        NEXT_PUBLIC_V2_AMBIENT_PERSISTENT_DECKS: ${NEXT_PUBLIC_V2_AMBIENT_PERSISTENT_DECKS:-0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://dummy:dummy@127.0.0.1:5432/dummy
      V2_DATABASE_URL: ${V2_DATABASE_URL:?Set V2_DATABASE_URL in the explicit V2 environment}
      # Empty values fail closed for Admin only; public catalog remains available.
      V2_ADMIN_USERNAME: ${V2_ADMIN_USERNAME:-}
      V2_ADMIN_PASSWORD: ${V2_ADMIN_PASSWORD:-}
      V2_MEDIA_STORAGE_BACKEND: ${V2_MEDIA_STORAGE_BACKEND:-local}
      V2_MEDIA_FINALIZE_MODE: ${V2_MEDIA_FINALIZE_MODE:-local}
      V2_MEDIA_DELIVERY_BACKEND: ${V2_MEDIA_DELIVERY_BACKEND:-local}
      V2_MEDIA_CDN_BASE_URL: ${V2_MEDIA_CDN_BASE_URL:-https://media.soundspa.bodhemusic.com}
      V2_DEVICE_BOOTSTRAP_ENABLED: ${V2_DEVICE_BOOTSTRAP_ENABLED:-0}
      V2_TEST_DEVICE_CREDENTIAL_FILE: ${V2_TEST_DEVICE_CREDENTIAL_FILE:-/var/www/soundspa-v2/.v2-test-device-credential}
      V2_S3_ENDPOINT: ${V2_S3_ENDPOINT:-}
      V2_S3_BUCKET: ${V2_S3_BUCKET:-}
      V2_S3_REGION: ${V2_S3_REGION:-}
      V2_S3_ACCESS_KEY_ID: ${V2_S3_ACCESS_KEY_ID:-}
      V2_S3_SECRET_ACCESS_KEY: ${V2_S3_SECRET_ACCESS_KEY:-}
      V2_S3_FORCE_PATH_STYLE: ${V2_S3_FORCE_PATH_STYLE:-0}
      V2_MEDIA_ROOT: /var/lib/soundspa-v2-media
    volumes:
      - type: bind
        source: /var/lib/soundspa-v2-media
        target: /var/lib/soundspa-v2-media
        bind:
          create_host_path: false
    depends_on:
      v2-postgres:
        condition: service_healthy
    command: npm run start
    mem_limit: 1g

  v2-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: soundspa_v2
      POSTGRES_USER: soundspa_v2
      POSTGRES_PASSWORD: ${V2_POSTGRES_PASSWORD:?Set a separate V2_POSTGRES_PASSWORD}
    volumes:
      - v2-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundspa_v2 -d soundspa_v2"]
      interval: 5s
      timeout: 5s
      retries: 10

  v2-migrate:
    profiles: ["tools"]
    build:
      context: .
      target: builder
      args:
        DATABASE_URL: postgresql://dummy:dummy@127.0.0.1:5432/dummy
    environment:
      V2_DATABASE_URL: ${V2_DATABASE_URL:?Set V2_DATABASE_URL in the explicit V2 environment}
    command: npm run db:v2:migrate
    depends_on:
      v2-postgres:
        condition: service_healthy

volumes:
  v2-pgdata:
    name: soundspa-v2-staging-pgdata
