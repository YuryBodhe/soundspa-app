server {
    # Слушаем только 80 порт внутри контейнера
    # Снаружи он проброшен как 8081
    listen 80;
    server_name bodhemusic.com www.bodhemusic.com soundspa.bodhemusic.com;

    # Логи для отладки внутри контейнера
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        # Передаем запрос в контейнер с приложением
        proxy_pass http://app:3000;
        
        # Передаем реальные заголовки, чтобы приложение знало IP юзера и протокол (https)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Поддержка WebSocket (критично для работы плеера и Next.js)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # CORS заголовки для бесперебойного стриминга звука
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    }
}